<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>demo reels — Carol Calcavecchia</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=League+Spartan:wght@200;300;400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <script src="js/transicao.js"></script>
  <script src="js/topbar.js" defer></script>
</head>
<body>
  <header class="site-header">
    <a href="index.html" class="logo">Carol<b>Calcavecchia</b></a>
    <nav>
      <ul class="menu">
        <li><a href="prints.html" data-label="prints">prints</a></li>
        <li><a href="reels.html" aria-current="page" data-label="demo reels">demo reels</a></li>
        <li><a href="contato.html" data-label="contato">contato</a></li>
      </ul>
    </nav>
  </header>

  <main>
    <section class="reels">
      <button class="arrow prev" aria-label="anterior">
        <svg viewBox="0 0 18 32" fill="none" stroke="currentColor" stroke-width="2"><path d="M16 2 2 16l14 14"/></svg>
      </button>

      <div class="stage">
        <div class="reel-frame" id="frame"></div>
        <div class="reel-meta">
          <span id="caption"></span>
          <span id="counter"></span>
        </div>
      </div>

      <button class="arrow next" aria-label="próximo">
        <svg viewBox="0 0 18 32" fill="none" stroke="currentColor" stroke-width="2"><path d="m2 2 14 14L2 30"/></svg>
      </button>
    </section>

    <!-- celular: todos os reels em sequência -->
    <section class="reel-list" id="list"></section>
  </main>

  <script>
    /*
     * Lista de reels. Para cada vídeo, preencha:
     *   embed: link de embed do YouTube/Vimeo (ex: "https://player.vimeo.com/video/123456")
     *          ou caminho de um arquivo .mp4 (ex: "videos/reel1.mp4")
     *   caption: descrição exibida abaixo do vídeo
     */
    const REELS = [
      { embed: "", caption: "demo reel description" },
      { embed: "", caption: "reel 2" },
      { embed: "", caption: "reel 3" },
      { embed: "", caption: "reel 4" },
      { embed: "", caption: "reel 5" },
    ];

    const frame = document.getElementById('frame');
    const caption = document.getElementById('caption');
    const counter = document.getElementById('counter');
    let i = 0;

    function media(r) {
      if (!r.embed) {
        const d = document.createElement('div');
        d.className = 'empty'; d.textContent = 'vídeo em breve';
        return d;
      }
      if (/\.(mp4|webm|mov)$/i.test(r.embed)) {
        const v = document.createElement('video');
        v.src = r.embed; v.controls = true; v.playsInline = true; v.preload = 'metadata';
        return v;
      }
      const f = document.createElement('iframe');
      f.src = r.embed;
      f.loading = 'lazy';
      f.allow = 'autoplay; fullscreen; picture-in-picture';
      f.allowFullscreen = true;
      return f;
    }

    // computador e tablet: um reel por vez, com setas
    function render() {
      const r = REELS[i];
      frame.replaceChildren(media(r));
      caption.textContent = r.caption;
      counter.textContent = `${i + 1}/${REELS.length}`;
    }

    const go = d => { i = (i + d + REELS.length) % REELS.length; render(); };
    document.querySelector('.prev').onclick = () => go(-1);
    document.querySelector('.next').onclick = () => go(1);
    document.addEventListener('keydown', e => {
      if (e.key === 'ArrowLeft') go(-1);
      if (e.key === 'ArrowRight') go(1);
    });

    // celular: lista em sequência (montada só quando a tela é de celular)
    const list = document.getElementById('list');
    const mobile = matchMedia('(max-width: 700px)');
    function update() {
      if (mobile.matches) {
        frame.replaceChildren();          // não deixa o vídeo do carrossel tocando escondido
        if (!list.childElementCount) {
          list.replaceChildren(...REELS.map(r => {
            const item = document.createElement('article');
            const box = document.createElement('div');
            box.className = 'reel-frame';
            box.appendChild(media(r));
            const cap = document.createElement('p');
            cap.className = 'reel-meta';
            cap.textContent = r.caption;
            item.append(box, cap);
            return item;
          }));
        }
      } else {
        list.replaceChildren();
        render();
      }
    }
    mobile.addEventListener('change', update);
    update();
  </script>
</body>
</html>
