  <div class="lightbox" id="lightbox" role="dialog" aria-modal="true"><img alt=""></div>

  <script>
    const lb = document.getElementById('lightbox');
    const lbImg = lb.querySelector('img');
    /*
     * Card de preço montado com os dados de cada foto (atributos data-* da <figure>,
     * conforme o catálogo de prints):
     *   data-titulo   título da obra (opcional)
     *   data-tamanho  "a4", "a3" ou medidas, ex. "38 × 13 cm"
     *   data-tipo     "padrao"  → fotográfica R$ 120 · fine art R$ 200
     *                 "fineart" → só fine art: R$ data-sem
     *   data-sem / data-com  preço do fine art sem e com moldura (catálogo);
     *                 a moldura aparece à parte, como acréscimo: com − sem
     *                 (no padrão: 440 − 200 = + R$ 240), valendo para qualquer impressão
     *   data-nota     observação curta (opcional)
     * A moldurinha com o tamanho tem medida fixa e vira paisagem ou retrato conforme a foto.
     * Foto sem data-tipo não mostra card.
     */
    function card(d, img) {
      if (!d.tipo) return null;
      const sem = Number(d.sem || 200), com = Number(d.com || 440);
      const rows = [];
      if (d.titulo) rows.push(`<dt class="title">${d.titulo}</dt>`);
      rows.push('<dt class="head">impressão</dt>');
      if (d.tipo !== 'fineart') rows.push('<dt>fotográfica</dt><dd>R$ 120</dd>');
      rows.push(`<dt>fine art</dt><dd>R$ ${sem}</dd>`);
      rows.push(`<dt class="strong">moldura</dt><dd class="strong-val">+ R$ ${com - sem}</dd>`);
      if (d.nota) rows.push(`<dt class="note">${d.nota}</dt>`);
      const el = document.createElement('div');
      el.className = 'price';
      el.innerHTML = `<div class="size">${d.tamanho}</div><dl>${rows.join('')}</dl>`;
      // a moldurinha do tamanho segue o formato da foto: paisagem ou retrato
      const size = el.querySelector('.size');
      const orient = () => size.classList.toggle('retrato', img.naturalHeight > img.naturalWidth);
      if (img.complete && img.naturalWidth) orient();
      else img.addEventListener('load', orient, { once: true });
      return el;
    }

    // tablet (toque, tela larga): 1º toque mostra o card, como o mouseover; 2º toque amplia
    const tablet = matchMedia('(hover: none) and (min-width: 701px)');
    const figs = document.querySelectorAll('.prints figure');
    figs.forEach(fig => {
      const c = card(fig.dataset, fig.querySelector('img'));
      if (c) fig.appendChild(c);
      fig.addEventListener('click', () => {
        if (tablet.matches && !fig.classList.contains('show-price')) {
          figs.forEach(f => f.classList.remove('show-price'));
          fig.classList.add('show-price');
          return;
        }
        const img = fig.querySelector('img');
        lbImg.src = img.src; lbImg.alt = img.alt;
        // celular: card desta foto abaixo da imagem ampliada
        lb.querySelector('.price')?.remove();
        const c = card(fig.dataset, img);
        if (c) lb.appendChild(c);
        lb.classList.add('open');
      });
    });
    const close = () => lb.classList.remove('open');
    lb.addEventListener('click', close);
    document.addEventListener('keydown', e => { if (e.key === 'Escape') close(); });
  </script>
